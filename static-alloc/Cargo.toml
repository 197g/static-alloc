[package]
name = "static-alloc"
version = "0.4.0"
description = "A bump allocator on static memory for the alloc-traits crate"
edition = "2024"
documentation = "https://docs.rs/static-alloc"
categories = ["embedded", "memory-management", "no-std"]
rust-version = "1.100"

authors.workspace = true
license.workspace = true
readme = "Readme.md"
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
# Soft deprecated: currently some functionality is built on top of abstractions
# in this crate but we're no longer recommending the main surface since the
# `Allocator` trait was stabilized in `core` in Rust 1.100.
alloc-traits = { path = "../alloc-traits", version = "0.1.0", optional = true }
portable-atomic = { version = "1", optional = true, default-features = false }

[dev-dependencies]

[features]
# Required to build for now but intent to deprecate. Once we remove the hard
# dependency on this we will recommend using no-default-features and remove
# this from the default list in the next major release.
default = ["alloc-traits"]
# Provides interop for `alloc::{boxed::Box, vec::Vec}`.
alloc = []
# Enables the `unsync::Chain` module. Note that this is explicitly outside the
# SemVer stability guarantees!
nightly_chain = ["alloc"]
# Enables the use of the `portable-atomic` crate to support targets without
# native atomic CAS operations
polyfill = ["portable-atomic"]

# Tests that test `Bump` as GlobalAlloc. Must be in a separate test each.
[[test]]
name = "vec"
path = "tests/vec.rs"

[[test]]
name = "vec_try"
path = "tests/vec_try.rs"
required-features = []

[[test]]
name = "huuuuuge"
path = "tests/alloc/huuuuuge.rs"
# Disabled because it chokes rustc. Just a PoC.
required-features = ["DISABLED"]

[[test]]
name = "unsync"
path = "tests/unsync.rs"

[[test]]
name = "chain"
path = "tests/chain.rs"
required-features = ["nightly_chain"]

[[test]]
name = "allocator-api2"
path = "tests/allocator-api2.rs"
required-features = ["alloc"]
